<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Two Moon Gardens - Product Catalogue</title>

<style>

/* =========================================================
   TWO MOON GARDENS
   PRODUCT CATALOGUE
   ========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;
    padding: 35px 20px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: #eee;

    min-height: 100vh;

    /*
       Moonlit woodland background.
       This uses CSS rather than an external image,
       so there is no extra file to upload.
    */

    background:

        radial-gradient(
            circle at 50% 0%,
            rgba(210, 190, 130, 0.16) 0%,
            rgba(210, 190, 130, 0.05) 18%,
            transparent 40%
        ),

        radial-gradient(
            ellipse at 15% 25%,
            rgba(50, 90, 62, 0.35),
            transparent 45%
        ),

        radial-gradient(
            ellipse at 85% 70%,
            rgba(35, 75, 48, 0.40),
            transparent 50%
        ),

        linear-gradient(
            135deg,
            #07130d 0%,
            #102319 35%,
            #17291e 55%,
            #09150f 100%
        );

    background-attachment: fixed;

    position: relative;
}


/* =========================================================
   SUBTLE BACKGROUND FOLIAGE
   ========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: 0.28;

    background:

        radial-gradient(
            ellipse at 5% 10%,
            transparent 0 45px,
            rgba(95,125,87,0.18) 46px 48px,
            transparent 49px
        ),

        radial-gradient(
            ellipse at 95% 20%,
            transparent 0 55px,
            rgba(95,125,87,0.16) 56px 58px,
            transparent 59px
        ),

        radial-gradient(
            ellipse at 10% 90%,
            transparent 0 70px,
            rgba(72,110,77,0.16) 71px 73px,
            transparent 74px
        ),

        radial-gradient(
            ellipse at 92% 85%,
            transparent 0 65px,
            rgba(72,110,77,0.14) 66px 68px,
            transparent 69px
        );

    z-index: -1;
}


/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.container {

    width: 100%;

    max-width: 1250px;

    margin: 0 auto;

    padding: 30px;

    border-radius: 18px;

    background:
        rgba(8, 20, 13, 0.84);

    border:
        1px solid rgba(190, 170, 110, 0.30);

    box-shadow:

        0 20px 60px rgba(0,0,0,0.55),

        inset
        0 1px 0
        rgba(255,255,255,0.05);

    backdrop-filter: blur(8px);

}


/* =========================================================
   TITLE
   ========================================================= */

h1 {

    text-align: center;

    margin:
        0 0 8px 0;

    color: #e6d49a;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 32px;

    letter-spacing: 3px;

    text-shadow:
        0 2px 12px rgba(0,0,0,0.8);

}


/* Subtitle */

.container::before {

    content:
        "A collection of Two Moon Gardens creations";

    display: block;

    text-align: center;

    margin-bottom: 28px;

    color: #aab99f;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 15px;

    font-style: italic;

}


/* =========================================================
   SEARCH
   ========================================================= */

.search-box {

    width: 100%;

    padding: 14px 18px;

    font-size: 16px;

    color: #eee;

    background:
        rgba(255,255,255,0.08);

    border:
        1px solid rgba(210,195,145,0.35);

    border-radius: 9px;

    outline: none;

    margin-bottom: 15px;

    transition:
        border-color 0.2s,
        background 0.2s,
        box-shadow 0.2s;

}


.search-box::placeholder {

    color:
        #aab3a8;

}


.search-box:focus {

    border-color:
        rgba(220,200,140,0.75);

    background:
        rgba(255,255,255,0.11);

    box-shadow:
        0 0 0 3px
        rgba(200,180,120,0.08);

}


/* =========================================================
   SORT
   ========================================================= */

.sort-box {

    display: flex;

    justify-content: flex-end;

    margin-bottom: 18px;

}


.sort-box select {

    padding:
        9px 13px;

    color: #eee;

    background:
        #1a2d20;

    border:
        1px solid
        rgba(210,195,145,0.35);

    border-radius: 7px;

    cursor: pointer;

}


.sort-box select option {

    background:
        #17271d;

    color: white;

}


/* =========================================================
   STATUS
   ========================================================= */

#status {

    text-align: center;

    margin-bottom: 20px;

    color:
        #aeb9aa;

    font-size: 14px;

}


/* =========================================================
   PRODUCT GRID
   ========================================================= */

#products {

    display: grid;

    grid-template-columns:
        repeat(5, minmax(0, 1fr));

    gap: 13px;

}


/* =========================================================
   PRODUCT CARD
   ========================================================= */

.product {

    display: flex;

    flex-direction: column;

    min-width: 0;

    min-height: 170px;

    padding: 14px;

    border-radius: 10px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.095),
            rgba(255,255,255,0.045)
        );

    border:
        1px solid
        rgba(190,180,135,0.22);

    box-shadow:
        0 5px 15px
        rgba(0,0,0,0.25);

    transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease;

}


.product:hover {

    transform:
        translateY(-3px);

    border-color:
        rgba(210,190,125,0.48);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.13),
            rgba(255,255,255,0.06)
        );

}


/* =========================================================
   PRODUCT NAME
   ========================================================= */

.product h2 {

    margin:
        0 0 10px 0;

    color:
        #e4d39b;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 16px;

    line-height: 1.25;

    overflow-wrap:
        anywhere;

}


/* =========================================================
   REGION
   ========================================================= */

.region {

    font-weight:
        bold;

    font-size:
        13px;

    color:
        #b8c9b4;

    margin-bottom:
        5px;

    overflow-wrap:
        anywhere;

}


/* =========================================================
   COORDINATES
   ========================================================= */

.coordinates {

    font-size:
        12px;

    color:
        #a4ada4;

    margin-bottom:
        13px;

}


/* =========================================================
   TELEPORT BUTTON
   ========================================================= */

.teleport {

    display:
        inline-block;

    margin-top:
        auto;

    padding:
        8px 11px;

    text-align:
        center;

    color:
        #fff;

    background:
        linear-gradient(
            135deg,
            #52754c,
            #3b5d3d
        );

    border:
        1px solid
        rgba(180,205,165,0.25);

    border-radius:
        6px;

    text-decoration:
        none;

    font-weight:
        bold;

    font-size:
        12px;

    letter-spacing:
        0.4px;

    transition:
        background 0.2s,
        transform 0.2s;

}


.teleport:hover {

    background:
        linear-gradient(
            135deg,
            #688e5e,
            #4a7049
        );

    transform:
        translateY(-1px);

}


/* =========================================================
   PAGINATION
   ========================================================= */

.pagination {

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    gap:
        6px;

    margin-top:
        30px;

    flex-wrap:
        wrap;

}


.pagination button {

    padding:
        8px 12px;

    color:
        #dce4da;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid
        rgba(190,180,135,0.25);

    border-radius:
        6px;

    cursor:
        pointer;

    transition:
        background 0.2s,
        border-color 0.2s;

}


.pagination button:hover {

    background:
        rgba(255,255,255,0.13);

    border-color:
        rgba(210,195,145,0.45);

}


.pagination button.active {

    font-weight:
        bold;

    color:
        #172319;

    background:
        #d8c98f;

    border-color:
        #d8c98f;

}


.pagination button:disabled {

    opacity:
        0.35;

    cursor:
        default;

}


/* =========================================================
   FOOTER FEEL
   ========================================================= */

#pagination::after {

    content:
        "Two Moon Gardens";

    width:
        100%;

    display:
        block;

    text-align:
        center;

    margin-top:
        18px;

    color:
        rgba(210,195,145,0.45);

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        12px;

    letter-spacing:
        1.5px;

}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 1100px) {

    #products {

        grid-template-columns:
            repeat(4, minmax(0, 1fr));

    }

}


@media (max-width: 850px) {

    body {

        padding:
            20px 12px;

    }

    .container {

        padding:
            22px 18px;

    }

    #products {

        grid-template-columns:
            repeat(3, minmax(0, 1fr));

    }

}


@media (max-width: 650px) {

    body {

        padding:
            12px 8px;

    }

    .container {

        padding:
            18px 12px;

        border-radius:
            12px;

    }

    h1 {

        font-size:
            25px;

        letter-spacing:
            2px;

    }

    #products {

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap:
            9px;

    }

    .product {

        padding:
            11px;

        min-height:
            160px;

    }

}


@media (max-width: 450px) {

    #products {

        grid-template-columns:
            1fr;

    }

}


/* =========================================================
   END CSS
   ========================================================= */

</style>

</head>


<body>


<div class="container">


    <h1>
        TWO MOON GARDENS
    </h1>


    <input
        type="text"
        id="search"
        class="search-box"
        placeholder="Search products..."
        autocomplete="off"
    >


    <div class="sort-box">

        <select id="sort">

            <option value="az">
                A–Z
            </option>

            <option value="za">
                Z–A
            </option>

        </select>

    </div>


    <div id="status">

        Loading products...

    </div>


    <div id="products"></div>


    <div
        id="pagination"
        class="pagination">
    </div>


</div>



<script>

/* =========================================================
   TWO MOON GARDENS
   PRODUCT CATALOGUE
   ========================================================= */


/* =========================================================
   GOOGLE SHEETS
   =========================================================

   COLUMN A = PRODUCT
   COLUMN B = REGION
   COLUMN C = X
   COLUMN D = Y
   COLUMN E = Z

   ========================================================= */

const SHEET_ID =
"1HcWx845mSpfJnwziugByJLn0Npc1aBSomOBa6esQWVM";


const SHEET_URL =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?tqx=out:json";


/* =========================================================
   SETTINGS
   ========================================================= */

const PRODUCTS_PER_PAGE = 100;


/* =========================================================
   VARIABLES
   ========================================================= */

let products = [];

let filteredProducts = [];

let currentPage = 1;


/* =========================================================
   LOAD GOOGLE SHEET
   ========================================================= */

function loadProducts() {

    const status =
        document.getElementById("status");


    status.textContent =
        "Loading products...";


    fetch(SHEET_URL)

    .then(function(response) {

        if (!response.ok) {

            throw new Error(
                "Google Sheets returned HTTP " +
                response.status
            );

        }

        return response.text();

    })


    .then(function(text) {

        console.log(
            "Google Sheets response received."
        );


        /*
         * Google GViz returns:
         *
         * google.visualization.Query.setResponse({...});
         *
         * Extract the JSON between the brackets.
         */


        const start =
            text.indexOf("{");


        const end =
            text.lastIndexOf("}");


        if (
            start === -1 ||
            end === -1
        ) {

            throw new Error(
                "Could not find valid JSON in Google Sheets response."
            );

        }


        const json =
            JSON.parse(
                text.substring(
                    start,
                    end + 1
                )
            );


        if (!json.table) {

            throw new Error(
                "Google Sheets returned no table data."
            );

        }


        const rows =
            json.table.rows || [];


        products =
            rows.map(function(row) {

                const cells =
                    row.c || [];


                return {

                    product:
                        cells[0]?.v ?? "",

                    region:
                        cells[1]?.v ?? "",

                    x:
                        cells[2]?.v ?? "",

                    y:
                        cells[3]?.v ?? "",

                    z:
                        cells[4]?.v ?? ""

                };

            });


        /*
         * Remove completely blank rows.
         */


        products =
            products.filter(
                function(product) {

                    return String(
                        product.product
                    )
                    .trim() !== "";

                }
            );


        if (
            products.length === 0
        ) {

            throw new Error(
                "The Google Sheet loaded, but contains no products."
            );

        }


        filteredProducts =
            products.slice();


        console.log(
            "Products loaded:",
            products.length
        );


        sortProducts();

    })


    .catch(function(error) {

        console.error(
            "TMG catalogue error:",
            error
        );


        status.innerHTML =
            "<strong>Unable to load products.</strong><br>" +
            "<small>" +
            escapeHTML(
                error.message
            ) +
            "</small>";

    });

}


/* =========================================================
   SORT PRODUCTS
   ========================================================= */

function sortProducts() {

    const sort =
        document
        .getElementById("sort")
        .value;


    filteredProducts.sort(
        function(a, b) {

            const nameA =
                String(
                    a.product
                )
                .toLowerCase();


            const nameB =
                String(
                    b.product
                )
                .toLowerCase();


            if (sort === "az") {

                return nameA.localeCompare(
                    nameB
                );

            }


            return nameB.localeCompare(
                nameA
            );

        }
    );


    currentPage = 1;


    displayPage();

}


/* =========================================================
   SEARCH
   ========================================================= */

function filterProducts() {

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    filteredProducts =
        products.filter(
            function(product) {

                return String(
                    product.product
                )
                .toLowerCase()
                .includes(search);

            }
        );


    sortProducts();

}


/* =========================================================
   DISPLAY PRODUCTS
   ========================================================= */

function displayPage() {

    const container =
        document.getElementById(
            "products"
        );


    const status =
        document.getElementById(
            "status"
        );


    container.innerHTML = "";


    const total =
        filteredProducts.length;


    const totalPages =
        Math.max(
            1,
            Math.ceil(
                total /
                PRODUCTS_PER_PAGE
            )
        );


    if (
        currentPage >
        totalPages
    ) {

        currentPage =
            totalPages;

    }


    const start =
        (currentPage - 1) *
        PRODUCTS_PER_PAGE;


    const end =
        Math.min(
            start +
            PRODUCTS_PER_PAGE,
            total
        );


    const pageProducts =
        filteredProducts.slice(
            start,
            end
        );


    /* =====================================================
       STATUS
       ===================================================== */

    if (total === 0) {

        status.textContent =
            "No products found.";

    }

    else {

        status.textContent =
            "Showing " +
            (start + 1) +
            "–" +
            end +
            " of " +
            total +
            " products";

    }


    /* =====================================================
       CREATE PRODUCT BOXES
       ===================================================== */

    pageProducts.forEach(
        function(product) {


            const region =
                encodeURIComponent(
                    String(
                        product.region
                    ).trim()
                );


            const x =
                String(
                    product.x
                ).trim();


            const y =
                String(
                    product.y
                ).trim();


            const z =
                String(
                    product.z
                ).trim();


            /*
             * Second Life SLURL
             */

            const slurl =
                "http://maps.secondlife.com/secondlife/" +
                region +
                "/" +
                x +
                "/" +
                y +
                "/" +
                z;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "product";


            card.innerHTML = `

                <h2>
                    ${escapeHTML(
                        product.product
                    )}
                </h2>

                <div class="region">
                    ${escapeHTML(
                        product.region
                    )}
                </div>

                <div class="coordinates">
                    ${escapeHTML(x)},
                    ${escapeHTML(y)},
                    ${escapeHTML(z)}
                </div>

                <a
                    class="teleport"
                    href="${slurl}"
                    target="_blank"
                    rel="noopener"
                >
                    TELEPORT
                </a>

            `;


            container.appendChild(
                card
            );


        }
    );


    createPagination(
        totalPages
    );

}


/* =========================================================
   PAGINATION
   ========================================================= */

function createPagination(
    totalPages
) {

    const container =
        document.getElementById(
            "pagination"
        );


    container.innerHTML = "";


    if (
        totalPages <= 1
    ) {

        return;

    }


    /* =====================================================
       PREVIOUS
       ===================================================== */

    const previous =
        document.createElement(
            "button"
        );


    previous.textContent =
        "← Previous";


    previous.disabled =
        currentPage === 1;


    previous.onclick =
        function() {

            currentPage--;


            displayPage();


            window.scrollTo(
                0,
                0
            );

        };


    container.appendChild(
        previous
    );


    /* =====================================================
       PAGE NUMBERS
       ===================================================== */

    for (
        let page = 1;
        page <= totalPages;
        page++
    ) {


        const button =
            document.createElement(
                "button"
            );


        button.textContent =
            page;


        if (
            page === currentPage
        ) {

            button.className =
                "active";

        }


        button.onclick =
            function() {

                currentPage =
                    page;


                displayPage();


                window.scrollTo(
                    0,
                    0
                );

            };


        container.appendChild(
            button
        );

    }


    /* =====================================================
       NEXT
       ===================================================== */

    const next =
        document.createElement(
            "button"
        );


    next.textContent =
        "Next →";


    next.disabled =
        currentPage ===
        totalPages;


    next.onclick =
        function() {

            currentPage++;


            displayPage();


            window.scrollTo(
                0,
                0
            );

        };


    container.appendChild(
        next
    );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   EVENTS
   ========================================================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        filterProducts
    );


document
    .getElementById("sort")
    .addEventListener(
        "change",
        sortProducts
    );


/* =========================================================
   START
   ========================================================= */

loadProducts();


</script>


</body>

</html>
