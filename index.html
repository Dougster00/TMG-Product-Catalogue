<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TMG Product Catalogue</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f1ea;
    margin: 0;
    padding: 30px;
    color: #333;
}

.container {
    max-width: 1100px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

.controls {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

input, select {
    padding: 12px;
    font-size: 16px;
    border: 1px solid #bbb;
    border-radius: 6px;
}

input {
    flex: 1;
    min-width: 250px;
}

#products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
}

.product {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.product h2 {
    margin-top: 0;
    font-size: 21px;
}

.category {
    font-weight: bold;
    margin-bottom: 10px;
}

.location {
    margin-bottom: 15px;
    line-height: 1.5;
}

.teleport {
    display: inline-block;
    background: #4b6f44;
    color: white;
    padding: 10px 16px;
    border-radius: 6px;
    text-decoration: none;
}

.teleport:hover {
    opacity: 0.85;
}

#status {
    text-align: center;
    margin: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>TMG PRODUCT CATALOGUE</h1>

<div class="controls">

<input
    type="text"
    id="search"
    placeholder="Search products..."
>

<select id="category">
    <option value="">All Categories</option>
</select>

</div>

<div id="status">Loading products...</div>

<div id="products"></div>

</div>

<script>

const SHEET_ID = "1HcWx845mSpfJnwziugByJLn0Npc1aBSomOBa6esQWVM";

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?tqx=out:json";

let products = [];

fetch(SHEET_URL)

.then(response => response.text())

.then(text => {

    const json = JSON.parse(
        text.substring(47).slice(0, -2)
    );

    const rows = json.table.rows;

    products = rows.map(row => {

        const cells = row.c;

        return {

            product: cells[0]?.v || "",
            category: cells[1]?.v || "",
            region: cells[2]?.v || "",
            x: cells[3]?.v || "",
            y: cells[4]?.v || "",
            z: cells[5]?.v || ""

        };

    });

    createCategories();

    displayProducts(products);

})

.catch(error => {

    document.getElementById("status").textContent =
        "Unable to load products.";

    console.error(error);

});


function createCategories() {

    const categorySelect =
        document.getElementById("category");

    const categories =
        [...new Set(
            products
            .map(p => p.category)
            .filter(Boolean)
        )]
        .sort();

    categories.forEach(category => {

        const option =
            document.createElement("option");

        option.value = category;
        option.textContent = category;

        categorySelect.appendChild(option);

    });

}


function displayProducts(list) {

    const container =
        document.getElementById("products");

    const status =
        document.getElementById("status");

    container.innerHTML = "";

    status.textContent =
        list.length +
        " product" +
        (list.length === 1 ? "" : "s") +
        " found";

    list.forEach(product => {

        const slurl =
            "https://maps.secondlife.com/secondlife/" +
            encodeURIComponent(product.region) +
            "/" +
            product.x +
            "/" +
            product.y +
            "/" +
            product.z;

        const card =
            document.createElement("div");

        card.className = "product";

        card.innerHTML = `

            <h2>${escapeHTML(product.product)}</h2>

            <div class="category">
                ${escapeHTML(product.category)}
            </div>

            <div class="location">
                <strong>${escapeHTML(product.region)}</strong><br>
                ${product.x}, ${product.y}, ${product.z}
            </div>

            <a
                class="teleport"
                href="${slurl}"
                target="_blank"
            >
                TELEPORT
            </a>

        `;

        container.appendChild(card);

    });

}


function filterProducts() {

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    const category =
        document
        .getElementById("category")
        .value;

    const filtered =
        products.filter(product => {

            const matchesSearch =
                product.product
                .toLowerCase()
                .includes(search);

            const matchesCategory =
                !category ||
                product.category === category;

            return matchesSearch &&
                   matchesCategory;

        });

    displayProducts(filtered);

}


function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


document
.getElementById("search")
.addEventListener(
    "input",
    filterProducts
);

document
.getElementById("category")
.addEventListener(
    "change",
    filterProducts
);

</script>

</body>
</html>
