<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TMG Product Catalogue</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f1ea;
    margin: 0;
    padding: 30px;
    color: #333;
}

.container {
    max-width: 1100px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

.search-box {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    font-size: 18px;
    border: 1px solid #bbb;
    border-radius: 8px;
    margin-bottom: 25px;
}

#status {
    text-align: center;
    margin-bottom: 20px;
}

#products {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
}

.product {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.product h2 {
    margin-top: 0;
    font-size: 21px;
}

.region {
    font-weight: bold;
    margin-bottom: 8px;
}

.coordinates {
    margin-bottom: 18px;
}

.teleport {
    display: inline-block;
    background: #4b6f44;
    color: white;
    padding: 11px 18px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
}

.teleport:hover {
    opacity: 0.85;
}

</style>
</head>

<body>

<div class="container">

<h1>TMG PRODUCT CATALOGUE</h1>

<input
    type="text"
    id="search"
    class="search-box"
    placeholder="Search products..."
>

<div id="status">
    Loading products...
</div>

<div id="products"></div>

</div>


<script>

/*
==================================================
TMG PRODUCT CATALOGUE
Google Sheet columns:

A = PRODUCT
B = REGION
C = X
D = Y
E = Z
==================================================
*/


const SHEET_ID =
"1HcWx845mSpfJnwziugByJLn0Npc1aBSomOBa6esQWVM";


const SHEET_URL =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?tqx=out:json";


let products = [];


/*
LOAD GOOGLE SHEET
*/

fetch(SHEET_URL)

.then(response => response.text())

.then(text => {

    const json =
        JSON.parse(
            text.substring(47).slice(0, -2)
        );


    const rows =
        json.table.rows;


    products =
        rows.map(row => {

            const cells = row.c;


            return {

                product:
                    cells[0]?.v || "",

                region:
                    cells[1]?.v || "",

                x:
                    cells[2]?.v || "",

                y:
                    cells[3]?.v || "",

                z:
                    cells[4]?.v || ""

            };

        });


    displayProducts(products);

})


.catch(error => {

    document.getElementById("status").textContent =
        "Unable to load products.";

    console.error(error);

});


/*
DISPLAY PRODUCTS
*/

function displayProducts(list) {

    const container =
        document.getElementById("products");

    const status =
        document.getElementById("status");


    container.innerHTML = "";


    status.textContent =
        list.length +
        " product" +
        (list.length === 1 ? "" : "s") +
        " found";


    list.forEach(product => {


        /*
        BUILD SECOND LIFE SLURL

        Example:

        EDEN PHOENIX
        129
        95
        701

        becomes:

        https://maps.secondlife.com/secondlife/
        EDEN%20PHOENIX/129/95/701
        */


        const region =
            String(product.region)
            .trim()
            .replace(/ /g, "%20");


        const slurl =
            "https://maps.secondlife.com/secondlife/" +
            region +
            "/" +
            String(product.x).trim() +
            "/" +
            String(product.y).trim() +
            "/" +
            String(product.z).trim();


        const card =
            document.createElement("div");


        card.className =
            "product";


        card.innerHTML = `

            <h2>
                ${escapeHTML(product.product)}
            </h2>

            <div class="region">
                ${escapeHTML(product.region)}
            </div>

            <div class="coordinates">
                ${escapeHTML(product.x)},
                ${escapeHTML(product.y)},
                ${escapeHTML(product.z)}
            </div>

            <a
                class="teleport"
                href="${slurl}"
                target="_blank"
                rel="noopener"
            >
                TELEPORT
            </a>

        `;


        container.appendChild(card);

    });

}


/*
SEARCH
*/

function searchProducts() {

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const filtered =
        products.filter(product => {

            return product.product
                .toLowerCase()
                .includes(search);

        });


    displayProducts(filtered);

}


/*
SAFE TEXT DISPLAY
*/

function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/*
SEARCH BOX
*/

document
.getElementById("search")
.addEventListener(
    "input",
    searchProducts
);

</script>

</body>
</html>
