<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMG Secure Image Admin</title>
  <style>
    :root{--gold:#d6ad55;--gold-soft:#f0d28a;--purple:#c89cff;--panel:#07171a;--line:rgba(214,173,85,.68);--text:#f3f0e6;--muted:#c8c0aa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;font-family:Arial,sans-serif;background:linear-gradient(rgba(2,8,16,.5),rgba(2,8,16,.65)),url("https://twomoongardens.store/tmg-background.jpg") center/cover fixed no-repeat;color:var(--text)}
    .wrap{max-width:900px;margin:auto}.header{text-align:center;margin-bottom:24px}.header h1{margin:0;color:var(--gold-soft);font-family:Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:3px;font-size:clamp(30px,5vw,48px)}.header p{color:var(--muted);margin:8px 0 0}
    .panel{background:linear-gradient(180deg,rgba(7,23,26,.97),rgba(4,15,18,.97));border:2px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 16px 50px rgba(0,0,0,.45)}
    label{display:block;margin:0 0 8px;color:var(--gold-soft);font-weight:bold}.field{width:100%;padding:13px 14px;border-radius:9px;border:1px solid rgba(214,173,85,.35);background:#0a1a1e;color:#fff;font-size:16px;margin-bottom:18px}
    .dropzone{border:2px dashed rgba(214,173,85,.7);border-radius:16px;padding:34px 18px;text-align:center;background:rgba(0,0,0,.18);cursor:pointer}.dropzone.dragover{background:rgba(214,173,85,.09)}.dropzone strong{display:block;color:var(--gold-soft);font-size:20px;margin-bottom:7px}.dropzone span{color:var(--muted)}#fileInput{display:none}
    .preview{display:none;margin:20px auto;width:100%;max-height:380px;object-fit:contain;border-radius:12px;background:#02090b;border:1px solid rgba(214,173,85,.28)}.preview.show{display:block}
    .button{width:100%;padding:14px;border:1px solid var(--line);border-radius:9px;background:#162a2f;color:var(--gold-soft);font-weight:bold;font-size:16px;cursor:pointer}.button:hover{background:#1d353b}.button:disabled{opacity:.45;cursor:not-allowed}
    .status{display:none;margin-top:16px;padding:14px;border-radius:9px;line-height:1.45}.status.show{display:block}.status.working{background:rgba(214,173,85,.1);color:var(--gold-soft)}.status.success{background:rgba(61,173,104,.16);color:#bff0ce}.status.error{background:rgba(190,64,64,.18);color:#ffc5c5}
    .note{margin-top:18px;color:var(--muted);font-size:13px;line-height:1.5}@media(max-width:700px){body{padding:15px}.panel{padding:17px}}
  </style>
</head>
<body>
<div class="wrap">
  <header class="header"><h1>TMG IMAGE ADMIN</h1><p>Upload to GitHub and update Google Sheets in one step</p></header>
  <section class="panel">
    <label for="productName">Existing product name</label>
    <input id="productName" class="field" type="text" placeholder="Type the exact product name from Google Sheets" autocomplete="off">

    <div id="dropzone" class="dropzone" role="button" tabindex="0">
      <strong>DRAG PRODUCT IMAGE HERE</strong>
      <span>or click to choose a JPG, PNG or WebP image</span>
    </div>
    <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp">
    <img id="preview" class="preview" alt="Selected product preview">

    <label for="filename">Catalogue filename — click to edit</label>
    <input id="filename" class="field" type="text" placeholder="The filename appears after selecting an image" autocomplete="off" spellcheck="false">

    <button id="uploadBtn" class="button" type="button" disabled>UPLOAD TO GITHUB &amp; UPDATE GOOGLE SHEET</button>
    <div id="status" class="status" role="status"></div>
    <div class="note">The product name must match exactly, although capital letters do not matter. If no single match is found, nothing will be changed.</div>
  </section>
</div>
<script>
const productName=document.getElementById('productName'),dropzone=document.getElementById('dropzone'),fileInput=document.getElementById('fileInput'),preview=document.getElementById('preview'),filenameEl=document.getElementById('filename'),uploadBtn=document.getElementById('uploadBtn'),statusEl=document.getElementById('status');
let currentFile=null,currentUrl='',filenameEdited=false;

function slugify(value){return String(value||'').trim().toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').replace(/-+/g,'-')}
function extension(file){const name=file.name.toLowerCase();if(file.type==='image/png'||name.endsWith('.png'))return'.png';if(file.type==='image/webp'||name.endsWith('.webp'))return'.webp';return'.jpg'}
function suggestedFilename(){if(!currentFile)return'';return(slugify(productName.value)||slugify(currentFile.name.replace(/\.[^.]+$/,''))||'tmg-product-image')+extension(currentFile)}
function refreshFilename(){if(!filenameEdited)filenameEl.value=suggestedFilename();refreshButton()}
function refreshButton(){uploadBtn.disabled=!(currentFile&&productName.value.trim()&&filenameEl.value.trim())}
function showStatus(message,type){statusEl.textContent=message;statusEl.className='status show '+type}
function handleFile(file){if(!file||!/^image\/(jpeg|png|webp)$/.test(file.type)){showStatus('Please choose a JPG, PNG or WebP image.','error');return}currentFile=file;filenameEdited=false;if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(file);preview.src=currentUrl;preview.classList.add('show');refreshFilename();statusEl.className='status'}
function fileToBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(new Error('The image could not be read.'));reader.readAsDataURL(file)})}

dropzone.addEventListener('click',()=>fileInput.click());dropzone.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();fileInput.click()}});fileInput.addEventListener('change',()=>handleFile(fileInput.files[0]));
['dragenter','dragover'].forEach(type=>dropzone.addEventListener(type,event=>{event.preventDefault();dropzone.classList.add('dragover')}));
['dragleave','drop'].forEach(type=>dropzone.addEventListener(type,event=>{event.preventDefault();dropzone.classList.remove('dragover')}));
dropzone.addEventListener('drop',event=>handleFile(event.dataTransfer.files[0]));
productName.addEventListener('input',refreshFilename);filenameEl.addEventListener('input',()=>{filenameEdited=true;refreshButton()});

uploadBtn.addEventListener('click',async()=>{
  if(uploadBtn.disabled)return;
  uploadBtn.disabled=true;showStatus('Uploading the image and updating Google Sheets…','working');
  try{
    const base64=await fileToBase64(currentFile);
    google.script.run
      .withSuccessHandler(result=>{showStatus(result.message,'success');uploadBtn.disabled=false})
      .withFailureHandler(error=>{showStatus(error&&error.message?error.message:String(error),'error');uploadBtn.disabled=false})
      .uploadAndUpdate({productName:productName.value.trim(),filename:filenameEl.value.trim(),mimeType:currentFile.type,base64:base64});
  }catch(error){showStatus(error.message||String(error),'error');uploadBtn.disabled=false}
});
</script>
</body>
</html>
