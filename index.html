```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TMG Product Catalogue</title>


<style>

/* ==========================================
   PAGE
   ========================================== */

body {

    font-family: Arial, sans-serif;

    background: #f4f1ea;

    margin: 0;

    padding: 30px;

    color: #333;

}


.container {

    max-width: 1100px;

    margin: auto;

}


/* ==========================================
   TITLE
   ========================================== */

h1 {

    text-align: center;

    margin-bottom: 25px;

}


/* ==========================================
   SEARCH
   ========================================== */

.search-box {

    width: 100%;

    box-sizing: border-box;

    padding: 14px;

    font-size: 18px;

    border: 1px solid #bbb;

    border-radius: 8px;

    margin-bottom: 20px;

}


/* ==========================================
   STATUS
   ========================================== */

#status {

    text-align: center;

    margin-bottom: 20px;

}


/* ==========================================
   PRODUCTS
   ========================================== */

#products {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));

    gap: 20px;

}


/* ==========================================
   PRODUCT CARD
   ========================================== */

.product {

    background: white;

    padding: 20px;

    border-radius: 10px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.12);

}


.product h2 {

    margin-top: 0;

    font-size: 21px;

    margin-bottom: 12px;

}


/* ==========================================
   REGION
   ========================================== */

.region {

    font-weight: bold;

    margin-bottom: 8px;

}


/* ==========================================
   COORDINATES
   ========================================== */

.coordinates {

    margin-bottom: 18px;

}


/* ==========================================
   TELEPORT BUTTON
   ========================================== */

.teleport {

    display: inline-block;

    background: #4b6f44;

    color: white;

    padding: 11px 18px;

    border-radius: 6px;

    text-decoration: none;

    font-weight: bold;

}


.teleport:hover {

    opacity: 0.85;

}


</style>

</head>


<body>


<div class="container">


<h1>
TMG PRODUCT CATALOGUE
</h1>


<input
    type="text"
    id="search"
    class="search-box"
    placeholder="Search products..."
>


<div id="status">

Loading products...

</div>


<div id="products">

</div>


</div>


<script>


/*
==================================================
TMG PRODUCT CATALOGUE
==================================================

GOOGLE SHEET STRUCTURE

COLUMN A = PRODUCT
COLUMN B = REGION
COLUMN C = X
COLUMN D = Y
COLUMN E = Z

Example:

Amsterdam in Bloom [adult]
EDEN PHOENIX
129
95
701

==================================================
*/


/*
==================================================
GOOGLE SHEET ID
==================================================
*/

const SHEET_ID =
"1HcWx845mSpfJnwziugByJLn0Npc1aBSomOBa6esQWVM";


/*
==================================================
GOOGLE SHEET DATA URL
==================================================
*/

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?tqx=out:json";


/*
==================================================
PRODUCT STORAGE
==================================================
*/

let products = [];


/*
==================================================
LOAD GOOGLE SHEET
==================================================
*/

fetch(SHEET_URL)

.then(function(response) {

    return response.text();

})


.then(function(text) {


    /*
    Google returns JSON wrapped in
    extra characters.

    Remove the wrapper.
    */

    const json =
        JSON.parse(
            text.substring(47).slice(0, -2)
        );


    const rows =
        json.table.rows;


    /*
    Convert spreadsheet rows
    into product objects.
    */

    products =
        rows.map(function(row) {


            const cells =
                row.c;


            return {


                /*
                COLUMN A
                */

                product:
                    cells[0]?.v || "",


                /*
                COLUMN B
                */

                region:
                    cells[1]?.v || "",


                /*
                COLUMN C
                */

                x:
                    cells[2]?.v || "",


                /*
                COLUMN D
                */

                y:
                    cells[3]?.v || "",


                /*
                COLUMN E
                */

                z:
                    cells[4]?.v || ""


            };


        });


    /*
    Remove completely empty rows.
    */

    products =
        products.filter(function(product) {

            return product.product.trim() !== "";

        });


    /*
    Display products.
    */

    displayProducts(products);


})


.catch(function(error) {


    document.getElementById("status").textContent =
        "Unable to load products.";


    console.error(error);


});


/*
==================================================
DISPLAY PRODUCTS
==================================================
*/

function displayProducts(list) {


    const container =
        document.getElementById("products");


    const status =
        document.getElementById("status");


    /*
    Clear previous results.
    */

    container.innerHTML = "";


    /*
    Show result count.
    */

    status.textContent =
        list.length +
        " product" +
        (list.length === 1 ? "" : "s") +
        " found";


    /*
    Create each product card.
    */

    list.forEach(function(product) {


        /*
        ==========================================
        BUILD SECOND LIFE SLURL
        ==========================================

        Example:

        Region:
        EDEN PHOENIX

        X:
        129

        Y:
        95

        Z:
        701


        Result:

        http://maps.secondlife.com/secondlife/
        EDEN%20PHOENIX/129/95/701
        */


        const region =
            String(product.region)
            .trim()
            .replace(/ /g, "%20");


        const x =
            String(product.x).trim();


        const y =
            String(product.y).trim();


        const z =
            String(product.z).trim();


        const slurl =
            "http://maps.secondlife.com/secondlife/" +
            region +
            "/" +
            x +
            "/" +
            y +
            "/" +
            z;


        /*
        Create product card.
        */

        const card =
            document.createElement("div");


        card.className =
            "product";


        /*
        Add product information.
        */

        card.innerHTML = `

            <h2>
                ${escapeHTML(product.product)}
            </h2>

            <div class="region">

                ${escapeHTML(product.region)}

            </div>

            <div class="coordinates">

                ${escapeHTML(product.x)},
                ${escapeHTML(product.y)},
                ${escapeHTML(product.z)}

            </div>

            <a

                class="teleport"

                href="${slurl}"

                target="_blank"

                rel="noopener"

            >

                TELEPORT

            </a>

        `;


        /*
        Add card to page.
        */

        container.appendChild(card);


    });


}


/*
==================================================
SEARCH PRODUCTS
==================================================
*/

function searchProducts() {


    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    /*
    Filter products by product name.
    */

    const filtered =
        products.filter(function(product) {


            return product.product
                .toLowerCase()
                .includes(search);


        });


    /*
    Display matching products.
    */

    displayProducts(filtered);


}


/*
==================================================
SAFE HTML TEXT
==================================================

Prevents product names containing
special characters from breaking
the webpage.

==================================================
*/

function escapeHTML(text) {


    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");


}


/*
==================================================
SEARCH BOX EVENT
==================================================
*/

document

.getElementById("search")

.addEventListener(

    "input",

    searchProducts

);


</script>


</body>

</html>
```
